name: Netcatty source export

on:
  push:
    branches:
      - automation/netcatty-source-export

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create source archive
        shell: bash
        run: |
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=release \
            --exclude=dist \
            -czf "$RUNNER_TEMP/netcatty-source.tar.gz" .

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: netcatty-source
          path: ${{ runner.temp }}/netcatty-source.tar.gz
          if-no-files-found: error
          retention-days: 1
