name: Temporary current input method branch export

on:
  push:
    branches:
      - automation/input-method-current-export
    paths:
      - .github/workflows/_input-method-current-export.yml

permissions:
  contents: write

jobs:
  export:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out current branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create current source archive
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=dist \
            --exclude=release \
            -czf "$RUNNER_TEMP/netcatty-current-input-method-branch.tar.gz" .

      - name: Upload current source archive
        uses: actions/upload-artifact@v4
        with:
          name: netcatty-current-input-method-branch
          path: ${{ runner.temp }}/netcatty-current-input-method-branch.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Record export run id
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '${{ github.run_id }}' > .github/input-method-current-export-run.txt
          git config user.name 'YuSaZh'
          git config user.email 'aimescc@icloud.com'
          git add .github/input-method-current-export-run.txt
          git commit -m 'chore: record current input method export run'
          git push origin HEAD:automation/input-method-current-export
